name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install 'torch>=2.1,<2.6' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,demo,gif]'
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/
      - run: python -m pytest --junitxml=outputs/test-results.xml
      - run: python -m scripts.run_solver_verification
      - run: python -m scripts.run_scenarios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python-version }}
          path: outputs/
