# Mid-power (H-mode-like) scenario — reference case
# Picard-ready: moderate grid, should converge in ~15 s.

grid:
  n_rho: 80

source:
  S0_e: 1.0
  S0_i: 0.0
  rho_dep: 0.3
  sigma: 0.1

bc:
  Te_ped: 500.0
  Ti_ped: 400.0

coupling:
  density: 1.5
  tau_eq: 0.01

solver:
  dt: 1.0e-4
  theta: 0.5
  sub_steps: 300

picard:
  max_iters: 50
  tol: 1.0e-4
  alpha0: 0.5

transport_e:
  chi_s: 1.0
  a_over_LTe_crit: 3.0
  alpha_s: 1.5
  chi_neo: 0.01

transport_i:
  chi_s: 0.5
  a_over_LTe_crit: 3.5
  alpha_s: 1.5
  chi_neo: 0.01

geometry: circular

output_dir: outputs/scenarios
