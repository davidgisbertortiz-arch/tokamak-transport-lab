# Low-power (Ohmic-like) circular scenario
# Picard-ready: small grid, few sub-steps → runs in ~5 s.

grid:
  n_rho: 60

source:
  S0_e: 0.3
  S0_i: 0.0
  rho_dep: 0.3
  sigma: 0.1

bc:
  Te_ped: 300.0
  Ti_ped: 250.0

coupling:
  density: 1.0
  tau_eq: 0.02

solver:
  dt: 1.0e-4
  theta: 0.5
  sub_steps: 200

picard:
  max_iters: 40
  tol: 1.0e-3
  alpha0: 0.5

transport_e:
  chi_s: 0.5
  a_over_LTe_crit: 3.0
  alpha_s: 1.5
  chi_neo: 0.02

transport_i:
  chi_s: 0.3
  a_over_LTe_crit: 4.0
  alpha_s: 1.5
  chi_neo: 0.02

geometry: circular

output_dir: outputs/scenarios
