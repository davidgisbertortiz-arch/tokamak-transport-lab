# Default solver configuration for tokamak-transport-lab
# Week 1 MVP: constant chi, Gaussian source, circular geometry

grid:
  n_rho: 100
  rho_min: 0.0
  rho_max: 1.0

plasma:
  R0: 1.65        # Major radius [m]
  a: 0.50         # Minor radius [m]
  Ip: 1.0e6       # Plasma current [A]
  B0: 5.4          # Toroidal field [T]

source:
  S0: 1.0          # Source amplitude
  rho_dep: 0.3     # Deposition centre (normalised radius)
  sigma: 0.1       # Gaussian width

bc:
  Te_ped: 500.0    # Pedestal temperature [eV] at rho=1

solver:
  dt: 1.0e-4
  n_steps: 5000
  theta: 0.5       # 0.5 = Crank-Nicolson

transport:
  chi0: 1.0        # Constant diffusivity [m^2/s]

geometry: circular

seed: 42
