# Dataset generation parameters

sampling:
  seed: 42
  alpha_s: 1.5       # stiffness exponent (fixed, not sampled)
  chi_neo: 0.01      # neoclassical floor [m²/s]

  bounds:
    a_over_LTe:      [0.5, 12.0]
    q:               [1.0, 5.0]
    s_hat:           [0.1, 3.0]
    nu_star:         [0.01, 2.0]
    chi_s:           [0.5, 5.0]
    a_over_LTe_crit: [2.0, 6.0]

sizes:
  train: 10000
  test:  2000

output_dir: "data"
